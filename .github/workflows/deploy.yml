name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build ValentynaWeb/ValentynaWeb.csproj --configuration Release --no-incremental

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync source to server
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='**/bin/' \
            --exclude='**/obj/' \
            --exclude='**/.vs/' \
            --exclude='.claude/' \
            --exclude='.env' \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/valentyna/

      # .env на сервері повністю керується з GitHub Secrets — руками не редагувати.
      # Секрет іде через stdin, а не в командному рядку ssh, щоб не світився в логах/ps.
      - name: Write .env from GitHub Secrets
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          printf 'GOOGLE_PLACES_API_KEY=%s\n' "$GOOGLE_PLACES_API_KEY" | \
            ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "umask 077 && cat > /opt/valentyna/.env"

      - name: Deploy on server
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd /opt/valentyna && docker compose up --build -d"
